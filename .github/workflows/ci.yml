name: Interval CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: State and game rules tests
        run: npm test
      - name: Verify required assets
        run: test -f index.html && test -f styles.css && test -f LICENSE
